<article class="property-card"><a href="{{ url_for('property_detail', property_id=p.id) }}" class="property-image">{% if p.image %}<img src="{{ url_for('static', filename=p.image) }}" alt="{{ p.title }}">{% else %}<div class="image-placeholder"><span>⌂</span><small>PROPERTY PHOTO</small></div>{% endif %}<span class="tag">{{ p.category }}</span></a><div class="property-info"><div class="property-type">{{ p.property_type }}</div><h3><a href="{{ url_for('property_detail', property_id=p.id) }}">{{ p.title }}</a></h3><p class="location">⌖ {{ p.location }}</p><div class="card-bottom"><strong>{{ p.price }}</strong><a href="{{ url_for('property_detail', property_id=p.id) }}">View details ↗</a></div></div></article>

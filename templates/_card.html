<article class="property-card"><a href="{{ url_for('property_detail', property_id=p.id) }}" class="property-image">{% if p.image %}<img src="{{ url_for('static', filename=p.image) }}" alt="{{ p.title }}" loading="lazy">{% else %}<div class="image-placeholder"><span>⌂</span><small>PROPERTY PHOTO</small></div>{% endif %}<span class="tag">{{ 'FOR SALE' if p.category == 'Sale' else 'FOR RENT' }}</span><span class="image-view">View details ↗</span></a><div class="property-info"><div class="property-meta"><span>{{ p.property_type }}</span><span>UDUPI</span></div><h3><a href="{{ url_for('property_detail', property_id=p.id) }}">{{ p.title }}</a></h3><p class="location"><span>⌖</span> {{ p.location }}</p><div class="card-bottom"><strong>{{ p.price }}</strong><a href="{{ url_for('property_detail', property_id=p.id) }}">VIEW PROPERTY <span>↗</span></a></div></div></article>

{% extends "base.html" %}{% block content %}<section class="form-page admin-edit"><div class="form-intro"><div class="eyebrow">ADMIN</div><h1>{% if item.id %}Edit property{% else %}Add a property{% endif %}</h1><p>Complete the details below. Listings appear on the public website after saving.</p></div><form class="form-card" method="post" enctype="multipart/form-data"><label>Property title *</label><input name="title" required value="{{ item.title or '' }}" placeholder="e.g. 2 BHK apartment near Manipal"><div class="form-row"><div><label>Listing type *</label><select name="category"><option {% if item.category=='Sale' %}selected{% endif %}>Sale</option><option {% if item.category=='Rent' %}selected{% endif %}>Rent</option></select></div><div><label>Property type *</label><select name="property_type">{% for t in ['Apartment','House','Plot / Land','Commercial','Villa'] %}<option {% if item.property_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div></div><label>Location *</label><input name="location" required value="{{ item.location or '' }}" placeholder="e.g. Manipal, Udupi"><label>Price *</label><input name="price" required value="{{ item.price or '' }}" placeholder="e.g. ₹75 lakh / ₹15,000 per month"><div class="form-row"><div><label>Bedrooms</label><input name="bedrooms" value="{{ item.bedrooms or '' }}" placeholder="e.g. 2 BHK"></div><div><label>Area</label><input name="area" value="{{ item.area or '' }}" placeholder="e.g. 1200 sq. ft."></div></div><label>Description</label><textarea name="description" rows="5">{{ item.description or '' }}</textarea><label>Property photo (JPG, PNG or WEBP)</label><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><label class="check-label"><input type="checkbox" name="featured" {% if item.featured %}checked{% endif %}> Feature this property on homepage</label><button class="btn btn-dark full-btn">Save property</button></form></section>{% endblock %}
